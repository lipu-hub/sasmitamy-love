<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sourav & Sonu ❤️ Aeyho</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }
        .floating-heart {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-pink-500 selection:text-white">

    <!-- Background Ambient Glow -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-rose-600/20 rounded-full blur-3xl"></div>
        <div class="absolute top-1/2 -right-40 w-96 h-96 bg-pink-600/20 rounded-full blur-3xl"></div>
    </div>

    <!-- Header -->
    <header class="relative z-10 p-6 text-center">
        <h1 class="text-3xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-rose-500">
            Sourav & Sonu ❤️ Aeyho
        </h1>
        <p class="text-xs text-rose-300/70 tracking-widest uppercase mt-1">A private space made for two hearts</p>
    </header>

    <!-- Main Container -->
    <main class="relative z-10 flex-grow flex flex-col items-center justify-center p-4 max-w-4xl mx-auto w-full">
        
        <!-- Landing / Welcome Card -->
        <div id="home-card" class="bg-slate-900/60 backdrop-blur-md border border-rose-500/20 p-8 rounded-3xl shadow-2xl text-center max-w-md w-full">
            <div class="text-5xl mb-4 floating-heart">💖</div>
            <h2 class="text-xl font-semibold mb-2 text-pink-200">Ready for our private date?</h2>
            <p class="text-sm text-slate-400 mb-6">Click below to open our secure video call room instantly with Sonu ji.</p>
            
            <button onclick="startCall()" class="w-full py-4 px-6 bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-white font-medium rounded-2xl shadow-lg shadow-rose-500/25 transition-all transform active:scale-95 text-lg">
                Join Secure Call 🚀
            </button>
        </div>

        <!-- Video Call Container (Embedded Jitsi Meet) -->
        <div id="call-container" class="hidden w-full h-[70vh] rounded-3xl overflow-hidden border border-rose-500/30 shadow-2xl bg-slate-900">
            <div id="jitsi-meet-room" class="w-full h-full"></div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="relative z-10 p-4 text-center text-xs text-slate-600">
        Built with love for Sourav & Sonu ✨
    </footer>

    <!-- Jitsi External API Script -->
    <script src="https://8x8.vc/vsc/external_api.js"></script>
    <script>
        function startCall() {
            // Hide Home Card and show Call Container
            document.getElementById('home-card').classList.add('hidden');
            document.getElementById('call-container').classList.remove('hidden');

            const domain = "8x8.vc"; // Secure public Jitsi instance
            const options = {
                roomName: "vsc/SouravAndSonuLoveRoomForeverAeyho143", // Unique secure room name
                width: "100%",
                height: "100%",
                parentNode: document.querySelector('#jitsi-meet-room'),
                userInfo: {
                    displayName: "Sourav"
                },
                configOverwrite: {
                    startWithAudioMuted: false,
                    startWithVideoMuted: false,
                },
                interfaceConfigOverwrite: {
                    TOOLBAR_BUTTONS: [
                        'microphone', 'camera', 'closedcaptions', 'desktop', 'fullscreen',
                        'fodeviceselection', 'hangup', 'chat', 'settings', 'videoquality',
                        'tileview'
                    ],
                }
            };

            const api = new JitsiMeetExternalAPI(domain, options);
        }
    </script>
</body>
</html>
